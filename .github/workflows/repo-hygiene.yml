name: Repo hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the file gate
        run: bash scripts/check-files-test.sh

      - name: Self-test the vocabulary gate
        run: bash scripts/check-vocab-test.sh

      - name: Gate files added by this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-files.sh --range "$BASE_SHA" "$HEAD_SHA"

      - name: Gate new prose on retired synonyms
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-vocab.sh --range "$BASE_SHA" "$HEAD_SHA"

      - name: Audit every tracked file
        if: github.event_name != 'pull_request'
        run: scripts/check-files.sh --tracked
