name: Bump package versions on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The bump runs the Sheets build after it raises the JS version.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A merged PR labeled "minor" raises the minor version and resets the
      # patch to 0; any other merged PR raises the patch. The script holds the
      # table of packages and their version files.
      - name: Bump the version of each package the merged PR touched
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files"
          python3 scripts/bump-versions.py "$MINOR" \
            < "$RUNNER_TEMP/changed-files" > "$RUNNER_TEMP/bumped-files"

      - name: Open version-bump PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xargs --no-run-if-empty git add -- < "$RUNNER_TEMP/bumped-files"
          if git diff --cached --quiet; then
            echo "No version files changed; nothing to commit."
            exit 0
          fi
          BUMP_BRANCH="chore/version-bump-pr-${{ github.event.pull_request.number }}"
          git checkout -b "$BUMP_BRANCH"
          git commit -m "chore(version): bump after #${{ github.event.pull_request.number }}"
          git push origin "$BUMP_BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(version): bump after #${{ github.event.pull_request.number }}" \
            --body "Automated version bump triggered by merge of PR #${{ github.event.pull_request.number }}." \
            --base main \
            --head "$BUMP_BRANCH")
          # main requires the pull request checks to pass, and they take a minute
          # or two from pull request creation, so wait for GitHub's merge-state verdict before
          # merging. CLEAN, HAS_HOOKS, and UNSTABLE all mean the merge will be
          # accepted. DIRTY (a conflict) and BEHIND (main advanced past the
          # bump) are terminal, so they end the run at once. BLOCKED covers
          # pending and failed checks alike, so a failed check waits out the
          # deadline. On timeout, leave the pull request and the branch for a
          # human, as on any other failed merge.
          READY=""
          for attempt in $(seq 1 40); do
            STATE=$(gh pr view "$PR_URL" --json mergeStateStatus \
              --jq .mergeStateStatus || echo UNKNOWN)
            case "$STATE" in
              CLEAN|HAS_HOOKS|UNSTABLE)
                READY="yes"
                break
                ;;
              DIRTY)
                echo "The bump conflicts with main. Leaving the branch and $PR_URL in place."
                exit 1
                ;;
              BEHIND)
                echo "main advanced past the bump branch. Leaving the branch and $PR_URL in place."
                exit 1
                ;;
            esac
            echo "Merge state is $STATE (attempt $attempt of 40); checking again in 15 seconds."
            sleep 15
          done
          if [ -z "$READY" ]; then
            echo "No merge-ready verdict within 10 minutes. Leaving the branch and $PR_URL in place."
            exit 1
          fi
          if ! gh pr merge "$PR_URL" --squash; then
            echo "Could not merge $PR_URL. Leaving the branch and the PR in place."
            exit 1
          fi
          # Automatic head-branch deletion does not fire for merges made with the
          # workflow token, so delete the bump branch here.
          git push origin --delete "$BUMP_BRANCH"
