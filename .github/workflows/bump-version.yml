name: Bump package versions on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect which packages changed
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - 'python/**'
            chrome:
              - 'chrome-extension/**'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Python version (python/pyproject.toml)
        if: steps.changes.outputs.python == 'true'
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("python/pyproject.toml")
          s = p.read_text()
          m = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', s, re.MULTILINE)
          if not m:
              raise SystemExit("Could not find version line in python/pyproject.toml")
          maj, minor, patch = map(int, m.groups())
          new = f"{maj}.{minor}.{patch + 1}"
          s2 = re.sub(r'^version\s*=\s*"[\d.]+"',
                      f'version = "{new}"', s, count=1, flags=re.MULTILINE)
          p.write_text(s2)
          print(f"python/pyproject.toml: bumped to {new}")
          PY

      - name: Bump Chrome extension version (chrome-extension/manifest.json)
        if: steps.changes.outputs.chrome == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("chrome-extension/manifest.json")
          mf = json.loads(p.read_text())
          parts = [int(x) for x in mf["version"].split(".")]
          # Bump the patch (3rd component). Pad to 3 if shorter.
          while len(parts) < 3:
              parts.append(0)
          parts[2] += 1
          # If there's a 4th component from earlier runs, drop it on patch bump.
          mf["version"] = ".".join(str(x) for x in parts[:3])
          p.write_text(json.dumps(mf, indent=2) + "\n")
          print(f"chrome-extension/manifest.json: bumped to {mf['version']}")
          PY

      - name: Verify the bumped version files still parse
        if: steps.changes.outputs.python == 'true' || steps.changes.outputs.chrome == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, tomllib
          checks = (
              ("chrome-extension/manifest.json", json.loads),
              ("python/pyproject.toml", tomllib.loads),
          )
          for name, parse in checks:
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              try:
                  parse(path.read_text())
              except Exception as exc:
                  sys.exit(f"{name} no longer parses after the version bump: {exc}")
              print(f"{name}: parses")
          PY

      - name: Open version-bump PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add python/pyproject.toml chrome-extension/manifest.json
          if git diff --cached --quiet; then
            echo "No version files changed; nothing to commit."
            exit 0
          fi
          BUMP_BRANCH="chore/version-bump-pr-${{ github.event.pull_request.number }}"
          git checkout -b "$BUMP_BRANCH"
          git commit -m "chore(version): bump after #${{ github.event.pull_request.number }}"
          git push origin "$BUMP_BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(version): bump after #${{ github.event.pull_request.number }}" \
            --body "Automated version bump triggered by merge of PR #${{ github.event.pull_request.number }}." \
            --base main \
            --head "$BUMP_BRANCH")
          # main requires the PR checks to pass, and they take a minute or two
          # from PR creation, so wait for GitHub's merge-state verdict before
          # merging. CLEAN, HAS_HOOKS, and UNSTABLE all mean the merge will be
          # accepted. BLOCKED covers pending and failed checks alike, so a
          # failed check waits out the deadline. On timeout, leave the PR and
          # the branch for a human, as on any other refusal.
          READY=""
          for attempt in $(seq 1 40); do
            STATE=$(gh pr view "$PR_URL" --json mergeStateStatus \
              --jq .mergeStateStatus || echo UNKNOWN)
            case "$STATE" in
              CLEAN|HAS_HOOKS|UNSTABLE)
                READY="yes"
                break
                ;;
              DIRTY)
                echo "The bump conflicts with main. Leaving the branch and $PR_URL in place."
                exit 1
                ;;
              BEHIND)
                echo "main advanced past the bump branch. Leaving the branch and $PR_URL in place."
                exit 1
                ;;
            esac
            echo "Merge state is $STATE (attempt $attempt of 40); checking again in 15 seconds."
            sleep 15
          done
          if [ -z "$READY" ]; then
            echo "No merge-ready verdict within 10 minutes. Leaving the branch and $PR_URL in place."
            exit 1
          fi
          if ! gh pr merge "$PR_URL" --squash; then
            echo "Could not merge $PR_URL. Leaving the branch and the PR in place."
            exit 1
          fi
          # Automatic head-branch deletion does not fire for merges made with the
          # workflow token, so delete the bump branch here.
          git push origin --delete "$BUMP_BRANCH"
